<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BALAP LIAR!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container game-page">
    <header>
      <h1>BALAP LIAR!</h1>
      <p class="created-by">dibuat oleh Teguh Sugi | Pengembang Teknologi Pembelajaran | PUSBANGKOM SDM LEGISLATIF</p>
    </header>

    <main>
      <div class="track-area">
        <div class="track" id="track"></div>
      </div>

      <div id="message" class="message"></div>

      <div class="question-grid" id="question-grid"></div>
    </main>

    <div id="winner-popup" class="popup hidden">
      <div class="popup-card">
        <h2 id="winner-text">Pemenang!</h2>
        <button id="close-popup">Restart</button>
      </div>
    </div>
    <div id="confetti-container" class="confetti-container"></div>

    <footer class="footer-controls">
      <button id="reset-game">Restart</button>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
